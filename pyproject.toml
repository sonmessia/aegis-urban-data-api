[project]
name = "urban-data-api"
version = "0.1.0"
description = "IoT urban data ingestion API — Aegis Platform benchmark workload"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi[standard]>=0.115.0",
    # ASGI server
    "uvicorn[standard]>=0.32.0",
    # Data validation & settings
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # Database — async ORM + driver
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    # Migrations
    "alembic>=1.14.0",
    # AWS SDK (Secrets Manager via Floci)
    "boto3>=1.35.0",
    "botocore>=1.35.0",
    # Structured logging
    "structlog>=24.4.0",
    # HTTP client (for inter-service calls)
    "httpx>=0.27.0",
    # Observability
    "opentelemetry-api>=1.27.0",
    "opentelemetry-sdk>=1.27.0",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "prometheus-fastapi-instrumentator>=7.0.0",
]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",        # async test client for FastAPI
    "anyio>=4.6.0",
    "aiosqlite>=0.20.0",    # in-memory sqlite async driver for tests
    # Type checking
    "mypy>=1.13.0",
    "sqlalchemy[mypy]>=2.0.36",
    # Linting & formatting
    "ruff>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# ─── uv settings ────────────────────────────────────────────────────────────
[tool.uv]
dev-dependencies = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.27.0",
    "anyio>=4.6.0",
    "aiosqlite>=0.20.0",
    "mypy>=1.13.0",
    "sqlalchemy[mypy]>=2.0.36",
    "ruff>=0.7.0",
]

# ─── Ruff (linter + formatter, replaces black + flake8 + isort) ─────────────
[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ANN", # flake8-annotations (type hints)
    "S",   # flake8-bandit (security)
    "PTH", # pathlib usage
    "RUF", # ruff-specific rules
]
ignore = [
    "ANN101", # missing type annotation for self
    "ANN102", # missing type annotation for cls
    "S104",   # binding to all interfaces (acceptable for container)
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S", "ANN"]  # relax security + annotation rules in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ─── mypy ───────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["sqlalchemy.ext.mypy.plugin"]
ignore_missing_imports = true

# ─── pytest ─────────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
