# deny.toml — cargo-deny configuration for aegis/urban-data-api
# Docs: https://embarkstudios.github.io/cargo-deny/

# ──────────────────────────────────────────────────────────────────────────────
# Security advisories
# Source: RustSec Advisory Database (https://rustsec.org)
# ──────────────────────────────────────────────────────────────────────────────
[advisories]
# Block builds that pull in crates with known vulnerabilities
vulnerability = "deny"

# Warn (but don't block) on crates that are no longer maintained
unmaintained = "warn"

# Warn on crates with known unsound usage (undefined behavior risks)
unsound = "warn"

# Warn on crates that have been yanked from crates.io
yanked = "warn"

# Warn on crates with security notices (informational, not full CVEs)
notice = "warn"

# Path to the local advisory database clone (optional; cargo-deny fetches automatically)
# db-path = "~/.cargo/advisory-db"

# Where to fetch the advisory DB from (default is the RustSec DB)
# db-urls = ["https://github.com/rustsec/advisory-db"]

# ──────────────────────────────────────────────────────────────────────────────
# License policy
# Block crates whose licenses are not in the allow-list below.
# ──────────────────────────────────────────────────────────────────────────────
[licenses]
# Licenses that are unconditionally permitted
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "ISC",
    "Unicode-DFS-2016",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "OpenSSL",
]

# Warn (don't block) on copyleft licenses such as GPL, LGPL, EUPL
copyleft = "warn"

# Fail on any license that doesn't appear in the allow list above
unlicensed = "deny"

# Confidence threshold for license text detection (0.0–1.0)
confidence-threshold = 0.8

# ──────────────────────────────────────────────────────────────────────────────
# Crate bans
# Prevent use of known-dangerous, deprecated, or policy-violating crates.
# ──────────────────────────────────────────────────────────────────────────────
[bans]
# Warn when multiple versions of the same crate are pulled in (bloat / confusion risk)
multiple-versions = "warn"

# Deny wildcard dependency specs (e.g. foo = "*") — they violate reproducible builds
wildcard-dependencies = "deny"

# Deny crates that we have explicitly banned for security or policy reasons
deny = [
    # { name = "openssl", reason = "Use rustls instead for pure-Rust TLS" },
]

# Crates allowed to appear more than once (common when transitive dep trees diverge)
# skip = [
#     { name = "syn", version = "=1" },
# ]

# ──────────────────────────────────────────────────────────────────────────────
# Source policy
# Restrict where crates may be fetched from.
# ──────────────────────────────────────────────────────────────────────────────
[sources]
# Block crates from registries not listed in `allow-registry`
unknown-registry = "deny"

# Block crates pulled from arbitrary git URLs not in `allow-git`
unknown-git = "deny"

# Registries that are allowed (crates.io is always implicitly allowed)
# allow-registry = ["https://dl-fuse.corp/crates"]

# Git sources that are explicitly allowed (e.g. internal forks)
# allow-git = ["https://github.com/your-org/private-fork"]
