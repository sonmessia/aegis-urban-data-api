name: CI — Urban Data API

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
  IMAGE_NAME: aegis/urban-data-api
  RUST_VERSION: "1.75"

# Cancel in-flight runs for the same branch/PR to avoid wasted spend
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─────────────────────────────────────────────
  # Job 1: Unit tests + format check
  # ─────────────────────────────────────────────
  test:
    name: Test & Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: ${{ runner.os }}-cargo-test-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-test-
            ${{ runner.os }}-cargo-

      - name: Run unit tests (all features, all workspace members)
        run: cargo test --all-features --workspace

      - name: Check formatting (rustfmt)
        run: cargo fmt --check

  # ─────────────────────────────────────────────
  # Job 2: Static analysis (parallel to test)
  # ─────────────────────────────────────────────
  lint:
    name: Lint (Clippy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain with Clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: ${{ runner.os }}-cargo-lint-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-lint-
            ${{ runner.os }}-cargo-

      - name: Run Clippy (deny all warnings)
        run: cargo clippy --all-targets --all-features -- -D warnings

  # ─────────────────────────────────────────────
  # Job 3: Supply-chain & SAST (parallel to test+lint)
  # ─────────────────────────────────────────────
  security-scan:
    name: Security Scan (SCA + SAST)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}

      - name: Cache Cargo registry & build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ./target
          key: ${{ runner.os }}-cargo-security-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-security-
            ${{ runner.os }}-cargo-

      # ── SCA: cargo-audit (known CVEs in dependency tree) ──
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked

      - name: Run cargo-audit (CVE scan)
        run: cargo audit

      # ── Policy: cargo-deny (licenses, advisories, duplicate crates) ──
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked

      - name: Run cargo-deny (license + advisory + ban check)
        run: cargo deny check

      # ── SAST: Semgrep (optional — may not be configured yet) ──
      - name: Run Semgrep SAST
        continue-on-error: true   # Non-blocking until rules are tuned
        run: |
          pip install semgrep --quiet
          semgrep --config=auto src/ \
            --error \
            --json-output=semgrep-report.json || true

      - name: Upload Semgrep report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # Job 4: Build Docker image + Trivy scan + ECR push
  #         Only on push to main (not PRs)
  # ─────────────────────────────────────────────
  build-image:
    name: Build & Push Image
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    outputs:
      image_tag: ${{ steps.meta.outputs.sha_tag }}
      image_uri: ${{ steps.meta.outputs.image_uri }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ── Generate image tags ──
      - name: Generate image metadata
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date -u '+%Y%m%dT%H%M')
          SHA_TAG="sha-${SHORT_SHA}"
          TS_TAG="main-${TIMESTAMP}"

          echo "sha_tag=${SHA_TAG}" >> "$GITHUB_OUTPUT"
          echo "ts_tag=${TS_TAG}"   >> "$GITHUB_OUTPUT"
          echo "short_sha=${SHORT_SHA}" >> "$GITHUB_OUTPUT"

          FULL_URI="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}"
          echo "image_uri=${FULL_URI}:${SHA_TAG}" >> "$GITHUB_OUTPUT"

          # Build a comma-separated tags string for docker/build-push-action
          TAGS="${FULL_URI}:${SHA_TAG},${FULL_URI}:${TS_TAG},${FULL_URI}:latest"
          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      # ── Build image (load locally for Trivy scan before push) ──
      - name: Build Docker image (local)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          load: true        # Load into local Docker daemon for scanning
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ── Trivy image vulnerability scan — block on HIGH/CRITICAL ──
      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.sha_tag }}"
          format: "table"
          exit-code: "1"
          ignore-unfixed: true
          severity: "HIGH,CRITICAL"
          timeout: "10m"

      - name: Upload Trivy SARIF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-sarif
          path: trivy-results.sarif
          if-no-files-found: ignore

      # ── Login to Amazon ECR ──
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      # ── Push all tags to ECR ──
      - name: Push image to ECR
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print published image URI
        run: |
          echo "::notice title=Image Published::${{ steps.meta.outputs.image_uri }}"

  # ─────────────────────────────────────────────
  # Job 5: GitOps — update image tag in aegis-infra
  #         Only on push to main
  # ─────────────────────────────────────────────
  update-gitops:
    name: GitOps Tag Update
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout aegis-gitops-infra repo
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/aegis-infra
          token: ${{ secrets.GH_PAT }}
          path: aegis-infra

      # ── Install yq for in-place YAML mutation ──
      - name: Install yq
        run: |
          YQ_VERSION="v4.43.1"
          wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

      # ── Patch the Helm values file ──
      - name: Update image tag in Helm values
        run: |
          IMAGE_TAG="sha-$(echo '${{ github.sha }}' | cut -c1-7)"
          VALUES_FILE="aegis-infra/manifests/wave-3-apps/urban-data-api/values.yaml"

          yq e ".image.tag = \"${IMAGE_TAG}\"" -i "${VALUES_FILE}"

          echo "Updated image.tag → ${IMAGE_TAG}"
          echo "File contents after update:"
          cat "${VALUES_FILE}"

      # ── Commit & push back to aegis-infra ──
      - name: Commit and push GitOps change
        run: |
          SHORT_SHA=$(echo '${{ github.sha }}' | cut -c1-7)
          cd aegis-infra

          git config user.email "ci-bot@aegis-platform"
          git config user.name "Aegis CI Bot"

          git add manifests/wave-3-apps/urban-data-api/values.yaml

          # Only commit if there is an actual diff (idempotent)
          git diff --staged --quiet \
            && echo "No changes to commit — image tag already up to date." \
            || git commit -m "chore(ci): update urban-data-api image to sha-${SHORT_SHA}

Triggered by: ${{ github.workflow }} #${{ github.run_number }}
Source commit: ${{ github.sha }}
Actor: ${{ github.actor }}"

          git push
