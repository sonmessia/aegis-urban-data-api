name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.ap-southeast-1.amazonaws.com
  IMAGE_NAME: aegis/urban-data-api

jobs:
  # ─── Job 1: Tests ────────────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies (with dev)
        run: uv sync --frozen

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=xml --cov-fail-under=80
        env:
          DATABASE_URL: "sqlite+aiosqlite:///:memory:"

      - name: Upload coverage report
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: coverage.xml
          fail_ci_if_error: false

  # ─── Job 2: Lint + Format ────────────────────────────────────────────────────
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: Ruff lint
        run: uv run ruff check app/ tests/ --output-format=github

      - name: Ruff format check
        run: uv run ruff format app/ tests/ --check

      - name: mypy type check
        run: uv run mypy app/

  # ─── Job 3: Security scan ─────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: uv sync --frozen

      - name: pip-audit — check CVEs in dependencies (SCA)
        run: |
          uv run pip-audit --require-hashes --format=json \
            --output=pip-audit-report.json || true
          uv run pip-audit --require-hashes

      - name: Semgrep SAST
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/python
            p/owasp-top-ten
            p/fastapi
        continue-on-error: true  # SAST findings are advisory until rules are tuned

      - name: Upload pip-audit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pip-audit-report
          path: pip-audit-report.json

  # ─── Job 4: Build & push Docker image ────────────────────────────────────────
  build-image:
    name: Build Image
    runs-on: ubuntu-latest
    needs: [test, lint, security-scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.sha-tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate image tags
        id: meta
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          TIMESTAMP=$(date -u +%Y%m%dT%H%M)
          echo "sha-tag=sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "tags<<EOF" >> "$GITHUB_OUTPUT"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${SHORT_SHA}" >> "$GITHUB_OUTPUT"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:main-${TIMESTAMP}" >> "$GITHUB_OUTPUT"
          echo "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (local load for scanning)
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: urban-data-api:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: urban-data-api:scan
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-1

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push to ECR
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── Job 5: Update image tag in aegis-infra (GitOps) ─────────────────────────
  update-gitops:
    name: Update GitOps
    runs-on: ubuntu-latest
    needs: [build-image]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Checkout aegis-infra
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/aegis-infra
          token: ${{ secrets.GH_PAT }}
          path: aegis-infra

      - name: Install yq
        run: |
          wget -qO /usr/local/bin/yq \
            "https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64"
          chmod +x /usr/local/bin/yq

      - name: Update image tag in Helm values
        run: |
          IMAGE_TAG="${{ needs.build-image.outputs.image-tag }}"
          yq e ".image.tag = \"${IMAGE_TAG}\"" -i \
            aegis-infra/manifests/wave-3-apps/urban-data-api/values.yaml
          echo "Updated image tag to: ${IMAGE_TAG}"
          cat aegis-infra/manifests/wave-3-apps/urban-data-api/values.yaml

      - name: Commit and push
        run: |
          cd aegis-infra
          git config user.email "ci-bot@aegis-platform.local"
          git config user.name "Aegis CI Bot"
          git add manifests/wave-3-apps/urban-data-api/values.yaml
          git diff --staged --quiet || \
            git commit -m "chore(ci): bump urban-data-api to ${{ needs.build-image.outputs.image-tag }}"
          git push

  # ─── Job 6: Trigger Umbrella repository update ─────────────────────────────
  trigger-umbrella:
    name: Trigger Umbrella Update
    runs-on: ubuntu-latest
    needs: [build-image, update-gitops]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Dispatch submodule-update event to aegis-platform
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          REPO_OWNER: ${{ github.repository_owner }}
          COMMIT_SHA: ${{ github.sha }}
          IMAGE_TAG: ${{ needs.build-image.outputs.image-tag }}
        run: |
          echo "Dispatching submodule-update event to ${REPO_OWNER}/aegis-platform..."
          curl -s -f -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPO_OWNER}/aegis-platform/dispatches" \
            -d "{
              \"event_type\": \"submodule-update\",
              \"client_payload\": {
                \"submodule\": \"aegis-urban-data-api\",
                \"commit_sha\": \"${COMMIT_SHA}\",
                \"image_tag\": \"${IMAGE_TAG}\",
                \"actor\": \"${{ github.actor }}\"
              }
            }" || echo "::warning::Could not dispatch event to aegis-platform. Check GH_PAT secret and repository permissions."

